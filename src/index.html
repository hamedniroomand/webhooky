<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta
      name="color-scheme"
      content="light dark"
    />
    <link
      rel="icon"
      type="image/png"
      href="./favicon.png"
    />
    <title>Webhooky — Webhook inspector</title>
    <meta
      name="description"
      content="Capture webhooks in a temporary inbox. Inspect request headers, query parameters, and payloads in real time."
    />
    <script>
      (function () {
        var key = 'webhooky-theme';
        var stored = localStorage.getItem(key);
        var dark =
          stored === 'dark' ||
          (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <script
      type="module"
      src="./frontend.tsx"
      async
    ></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
