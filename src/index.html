    />

      content="light dark"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#f5f6f3"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#111214"
    />
    <link

      href="./favicon.png"
    />

    <meta
      name="description"
      content="Capture webhooks in a temporary inbox. Inspect request headers, query parameters, and payloads in real time."

    <meta
      property="og:type"

    />
    <meta

      content="Webhooky"
    />
    <meta

      content="https://webhooky.kitdev.space/"

    <meta
      property="og:title"

    <meta

    <meta

    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-L0WY8Y2NC8"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());
      gtag('config', 'G-L0WY8Y2NC8');
    </script>
    <script>
      (function () {
        var key = 'webhooky-theme';
        var stored = localStorage.getItem(key);
        var dark =
          stored === 'dark' ||
          (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <script
      type="module"
      src="./frontend.tsx"
      async
    ></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
